---
services:
  db:
    image: anud58123/prod1:db
    ports:
      - '3306:3306'
    networks:
      - mynetwork
    volumes:
      - mydata:/var/lib/mysql
    deploy:
      replicas: 3

  auth_service:
    image: anud58123/prod1:auth
    deploy:
      replicas: 3
    ports:
      - '1111:5000'
    networks:
      - mynetwork
    depends_on:
      - db
    

  book_service:
    image: anud58123/prod1:book
    deploy:
      replicas: 3
    ports:
      - '1112:5000'
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    image: anud58123/prod1:borrow
    deploy:
      replicas: 3
    ports:
      - '1113:5000'
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: anud58123/prod1:webapp
    deploy:
      replicas: 3
    ports:
      - '1114:5000'
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service
      - db

networks:
  mynetwork:
    driver: bridge
volumes:
  mydata:
