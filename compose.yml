---
services:
  db:
    image: anud58123/prod1:db
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork
    volumes:
      - mydata:/var/lib/mysql

  auth_service:
    image: anud58123/prod1:auth
    deploy:
      replicas: 1
    ports:
      - "1111:5000"
    networks:
      - mynetwork
    depends_on:
      - db
    

  book_service:
    image: anud58123/prod1:book
    deploy:
      replicas: 1
    ports:
      - "1112:5000"
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    image: anud58123/prod1:borrow
    deploy:
      replicas: 1
    ports:
      - "1113:5000"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: anud58123/prod1:frontend
    deploy:
      replicas: 1
    ports:
      - "1114:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay
