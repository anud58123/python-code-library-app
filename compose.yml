---
services:
  db:
    image: anud58123/prod1:db
    ports:
      - '3307:3306'
    volumes:
      - mydata:/var/lib/mysql
    deploy:
      replicas: 3

  auth_service:
    image: anud58123/prod1:auth
    ports:
      - '5001:5001'
    
    depends_on:
      - db
    

  book_service:
    image: anud58123/prod1:book
    ports:
      - '5002:5002'
    
    depends_on:
      - db
  borrow_service:
    image: anud58123/prod1:borrow
    ports:
      - '5003:5003'
    
    depends_on:
      - db

  frontend:
    image: anud58123/prod1:webapp
    deploy:
      replicas: 3
    ports:
      - '5000:5000'

    depends_on:
      - auth_service
      - book_service
      - borrow_service
      - db
      
volumes:
  mydata:
